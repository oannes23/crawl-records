name: release

# Cutting a version tag IS the build+publish signal. Tag the commit `vX.Y.Z` and push it:
#   git tag v0.1.0 && git push origin v0.1.0
# CI builds the image and pushes ghcr.io/<owner>/crawl-records:X.Y.Z (+ :latest).
# Deploy is a separate, deliberate step in the local-infra repo (GitOps-pinned compose).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write   # push to GitHub Container Registry

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Derive the semver (strip the leading "v") for the image tag.
      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crawl-records:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/crawl-records:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
