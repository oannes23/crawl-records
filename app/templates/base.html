<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embassy admin — {% block title %}{% endblock %}</title>
  <style>
    :root { --bg:#15171c; --panel:#1e2128; --ink:#e6e8ee; --muted:#9aa3b2;
            --line:#2c313b; --accent:#d8a657; --good:#a9c977; --bad:#e08a7a; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
           background:var(--bg); color:var(--ink); }
    header { display:flex; gap:1rem; align-items:center; padding:.6rem 1rem;
             background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
    header .brand { color:var(--accent); font-weight:700; letter-spacing:.04em; }
    nav a { color:var(--muted); text-decoration:none; padding:.25rem .5rem; border-radius:4px; }
    nav a:hover { color:var(--ink); background:var(--bg); }
    nav a.active { color:var(--ink); background:var(--bg); border:1px solid var(--line); }
    main { padding:1rem 1.25rem; max-width:1200px; }
    h1 { font-size:1.1rem; margin:.2rem 0 1rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.35rem .6rem; border-bottom:1px solid var(--line);
             white-space:nowrap; }
    th { color:var(--muted); font-weight:600; cursor:pointer; }
    tr:hover td { background:var(--panel); }
    a { color:var(--accent); }
    input, select { background:var(--bg); color:var(--ink); border:1px solid var(--line);
                    border-radius:4px; padding:.3rem .5rem; font:inherit; }
    .filters { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
            padding:1rem; margin-bottom:1rem; }
    .muted { color:var(--muted); }
    .good { color:var(--good); } .bad { color:var(--bad); }
    pre { background:var(--bg); border:1px solid var(--line); border-radius:6px;
          padding:.75rem; overflow:auto; max-height:480px; }
    .kpi { font-size:1.6rem; color:var(--accent); }
    code { color:var(--good); }
  </style>
</head>
<body>
  <header>
    <span class="brand">⚑ EMBASSY ADMIN</span>
    <nav>
      {% set p = page|default('') %}
      <a href="/admin/" class="{{ 'active' if p=='home' }}">overview</a>
      <a href="/admin/runs" class="{{ 'active' if p=='runs' }}">runs</a>
      <a href="/admin/identities" class="{{ 'active' if p=='identities' }}">identities</a>
      <a href="/admin/bests" class="{{ 'active' if p=='bests' }}">bests</a>
      <a href="/admin/daily" class="{{ 'active' if p=='daily' }}">daily</a>
      <a href="/admin/instruments" class="{{ 'active' if p=='instruments' }}">instruments</a>
      <a href="/admin/health" class="{{ 'active' if p=='health' }}">health</a>
    </nav>
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
